<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>孤島の遺伝子</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <h1>孤島の遺伝子</h1>
        <p>百の生物を島に閉じ込めたら、遺伝子はどう変わる？</p>
      </div>
      <div class="clock" aria-live="polite">
        <span id="clock-year" class="clock-year">0年目</span>
        <span id="clock-month"></span>
        <span id="clock-temp"></span>
        <span id="clock-status" class="clock-status"></span>
      </div>
      <div class="controls">
        <button id="btn-play" class="primary" type="button">▶ 再生</button>
        <button id="btn-step" type="button" title="1年進める">+1年</button>
        <label class="speed">
          速度
          <select id="speed">
            <option value="2">1か月/0.5秒</option>
            <option value="6">半年/秒</option>
            <option value="12" selected>1年/秒</option>
            <option value="36">3年/秒</option>
            <option value="120">10年/秒</option>
          </select>
        </label>
      </div>
    </header>

    <main class="layout">
      <section class="map-col">
        <div class="map-toolbar">
          <label>
            表示
            <select id="display-mode">
              <option value="natural">見た目（体色・模様・発光）</option>
              <option value="sex">性別</option>
              <option value="inbreeding">近交係数 F</option>
              <option value="immunity">免疫型</option>
              <option value="age">年齢</option>
            </select>
          </label>
          <div id="map-legend" class="map-legend"></div>
        </div>
        <div class="map-wrap">
          <canvas id="map" aria-label="島の地図。個体をクリックすると詳細が見られます"></canvas>
          <div id="overlay" class="overlay" hidden></div>
        </div>
        <div id="quick-stats" class="quick-stats"></div>
        <div class="events" role="group" aria-label="介入">
          <span class="events-label">神の介入</span>
          <button type="button" data-event="epidemic">🦠 疫病</button>
          <button type="button" data-event="famine">🥀 干ばつ</button>
          <button type="button" data-event="cold">❄️ 寒冷期</button>
          <button type="button" data-event="storm">🌀 大嵐</button>
          <button type="button" data-event="castaway">🛶 漂着者</button>
          <button type="button" data-event="predators">🦅 捕食者を放つ</button>
        </div>
        <div class="log-wrap">
          <h2>島の年代記</h2>
          <ol id="log" class="log"></ol>
        </div>
      </section>

      <section class="side-col">
        <nav class="tabs" role="tablist">
          <button type="button" role="tab" data-tab="creature" aria-selected="true">個体</button>
          <button type="button" role="tab" data-tab="stats">集団</button>
          <button type="button" role="tab" data-tab="genes">遺伝子頻度</button>
          <button type="button" role="tab" data-tab="guide">遺伝図鑑</button>
          <button type="button" role="tab" data-tab="settings">設定</button>
        </nav>
        <div class="tab-panel" id="tab-creature" role="tabpanel"></div>
        <div class="tab-panel" id="tab-stats" role="tabpanel" hidden></div>
        <div class="tab-panel" id="tab-genes" role="tabpanel" hidden></div>
        <div class="tab-panel" id="tab-guide" role="tabpanel" hidden></div>
        <div class="tab-panel" id="tab-settings" role="tabpanel" hidden></div>
      </section>
    </main>

    <script type="module" src="src/main.js"></script>
  </body>
</html>
